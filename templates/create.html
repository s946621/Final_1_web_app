{% extends "base.html" %}

{% block content %}
<h2>Create New Entry</h2>

<!-- TODO: Create a form that sends a POST request -->

<form method="POST">

    <input type="range" min="1" max="100" value="50" class="slider" id="importance"><br>
    <p> How badly must you see this in the future?</p>
    <span id="sliderValue" class="value"></span>
    <script>
        // Get references to slider and display span
        const slider = document.getElementById('importance');
        const output = document.getElementById('sliderValue');

        // Update display when slider value changes
        slider.addEventListener('input', function () {
            output.textContent = this.value;
        });

        // Initialize display on page load
        output.textContent = slider.value;
    </script><br>

    <input name="title" placeholder="Title"><br>
    
    <input name="content" placeholder="What your heart feels"><br>

    <button type="submit">Upload your feelings!</button>

</form>
<a href="/dashboard">Back to lovely memories!</a>
<!-- TODO: Add a link back to dashboard -->

{% endblock %}
